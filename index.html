<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Microneedle patch lab</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--panel:#fff;--ink:#12202e;--muted:#5b6b7b;--line:#d5dde4;--accent:#0f8b8d;--accent-ink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1724;--panel:#12263a;--ink:#e6eef5;--muted:#93a7ba;--line:#24405a;--accent:#4fd1c5;--accent-ink:#06222a}}
:root[data-theme="dark"]{--bg:#0a1724;--panel:#12263a;--ink:#e6eef5;--muted:#93a7ba;--line:#24405a;--accent:#4fd1c5;--accent-ink:#06222a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(26px,4vw,40px);margin:0 0 4px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 18px;max-width:62ch}
.grid{display:grid;grid-template-columns:320px 1fr;gap:16px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.seg button,.btns button{font:inherit;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px;border-radius:8px;cursor:pointer}
.seg button.on,.btns button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.desc{color:var(--muted);font-size:13.5px;margin:0 0 14px;min-height:40px}
.ctl{margin:12px 0}.ctl label{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
.ctl label span{font-weight:400;color:var(--accent)}
.ctl small{display:block;color:var(--muted);font-size:12.5px}
input[type=range]{width:100%;accent-color:var(--accent)}
.btns{display:flex;gap:8px;margin-top:14px}.btns button{flex:1}
.scene{background:#0d1a29;border-radius:12px;padding:6px;border:1px solid var(--line)}
canvas{display:block;width:100%;height:auto}
.legend{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#9fb3c6;padding:2px 8px 4px}
.legend i{flex:0 0 120px;height:8px;border-radius:4px;background:linear-gradient(90deg,hsl(200 90% 62%),hsl(115 90% 62%),hsl(30 90% 62%))}
.note{margin:10px 0 0;padding:10px 12px;border-left:3px solid var(--accent);background:var(--panel);border-radius:0 8px 8px 0;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:22px;font-weight:800}.stat span{color:var(--muted);font-size:12.5px}
.charts{display:grid;grid-template-columns:3fr 2fr;gap:12px}
@media(max-width:620px){.charts{grid-template-columns:1fr}}
.charts h2{font-size:14px;margin:0 0 6px}
</style></head><body><div class="wrap">
<h1>Microneedle patch lab</h1>
<p class="sub">Pick a patch type, tune the needle and the drug, and watch the drug move through the skin. Dots are drug molecules; the graphs update as they go.</p>
<div class="grid">
<div class="card">
 <div class="seg" id="types"></div><p class="desc" id="desc"></p>
 <div id="sliders"></div>
 <div class="btns"><button class="main" id="play">Pause</button><button id="restart">Restart</button><button id="defaults">Reset defaults</button></div>
</div>
<div>
 <div class="scene"><canvas id="scene"></canvas>
 <div class="legend">Drug colour: water-loving <i></i> oil-loving</div></div>
 <p class="note" id="note"></p>
 <div class="stats" id="stats"></div>
 <div class="charts">
  <div class="card"><h2>Where the drug is over time (% of dose)</h2><canvas id="c1"></canvas></div>
  <div class="card"><h2>Drug in skin by depth</h2><canvas id="c2"></canvas></div>
 </div>
</div></div></div>
<script>
const $=id=>document.getElementById(id);
const W=2000,S=.4,CW=800,CH=500,SURF=170,GEL=30,CAP0=330,CAP1=365,DMAX=800,N=240,TMAX=60;
const P={len:500,sharp:.6,count:5,mwl:2.5,lip:1,rate:1,sc:20,speed:3};
const DEF={...P};
const TYPES={
 solid:['Solid','Pokes holes, then a drug gel on the skin seeps into them. The holes reseal within about an hour.'],
 coated:['Coated','Drug is painted on the needle surface and washes off within minutes. Fast, but a small payload.'],
 dissolving:['Dissolving','The needle itself is drug-loaded and melts away in the skin, releasing drug steadily.'],
 hollow:['Hollow','Each needle has a tiny bore. Drug is pushed from a reservoir and leaves at the tip.']};
const SL=[['len','Needle length',100,800,25,v=>v+' µm','Longer needles reach deeper'],
['sharp','Tip sharpness',0,1,.05,v=>Math.round(v*100)+'%','Blunt tips dent the skin instead of entering'],
['count','Needles in patch',2,8,1,v=>v,''],
['mwl','Drug size (molecular weight)',2,5,.05,v=>{const m=10**v;return m<1000?Math.round(m)+' Da':(m/1000).toFixed(1)+' kDa'},'Lidocaine ≈ 234 Da · insulin ≈ 5.8 kDa'],
['lip','Oil-friendliness (logP)',-3,5,.5,v=>v+(v<0?' water-loving':v>3?' oil-loving':''),'Low = dissolves in water, high = dissolves in fat'],
['rate','Release speed',.3,3,.1,v=>'×'+v.toFixed(1),'Not used by solid patches'],
['sc','Skin barrier thickness',10,40,5,v=>v+' µm','The stratum corneum, the skin’s outer wall'],
['speed','Playback speed',1,6,1,v=>'×'+v,'']];
let type='dissolving',parts=[],t=0,running=true,hist=[],firstBlood=null,needles=[],pen=0,scM=0,mwF=1,aq=1,lastRec=-1,frame=0;
const mw=()=>10**P.mwl;
// UI
$('types').innerHTML=Object.keys(TYPES).map(k=>`<button data-t="${k}">${TYPES[k][0]}</button>`).join('');
$('sliders').innerHTML=SL.map(s=>`<div class="ctl"><label for="s_${s[0]}">${s[1]}<span id="v_${s[0]}"></span></label><input type="range" id="s_${s[0]}" min="${s[2]}" max="${s[3]}" step="${s[4]}" value="${P[s[0]]}"><small>${s[6]}</small></div>`).join('');
SL.forEach(s=>{const e=$('s_'+s[0]);const upd=()=>{P[s[0]]=+e.value;$('v_'+s[0]).textContent=s[5](P[s[0]])};upd();
 e.addEventListener('input',()=>{upd();if(s[0]!=='speed')reset()})});
$('types').onclick=e=>{const b=e.target.closest('button');if(b){type=b.dataset.t;reset()}};
$('play').onclick=()=>{running=!running;$('play').textContent=running?'Pause':'Play'};
$('restart').onclick=reset;
$('defaults').onclick=()=>{type='dissolving';SL.forEach(s=>{const k=s[0];P[k]=DEF[k];$('s_'+k).value=DEF[k];$('v_'+k).textContent=s[5](DEF[k])});running=true;$('play').textContent='Pause';reset()};
function setup(c,w,h){const d=window.devicePixelRatio||1;c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.scale(d,d);return x}
const sx=setup($('scene'),CW,CH),c1=setup($('c1'),480,230),c2=setup($('c2'),300,230);
// model
const tipW=()=>2+4*(1-P.sharp),hw=y=>tipW()+(24-tipW())*Math.max(0,1-y/pen);
const near=x=>needles[Math.max(0,Math.min(needles.length-1,Math.round(x/W*(needles.length+1)-1)))];
const gauss=()=>{let u=0;for(let i=0;i<4;i++)u+=Math.random();return (u-2)*1.73};
const layer=y=>y<0?1:y<P.sc?scM:y<100?aq*.8:aq;
function reset(){
 pen=Math.min(P.len*(.55+.4*P.sharp),DMAX);
 needles=[];for(let i=0;i<P.count;i++)needles.push((i+1)/(P.count+1)*W);
 aq=1/(1+Math.max(0,P.lip-1.5)*.7);
 scM=(.002+.12*Math.exp(-((P.lip-2.5)**2)/4.5))/(1+(mw()/500)**2)*(20/P.sc);
 mwF=(100/mw())**.25;
 const dur=type==='coated'?6/P.rate:type==='dissolving'?40/P.rate:type==='hollow'?30/P.rate:0;
 parts=[];
 for(let i=0;i<N;i++){const nx=needles[i%needles.length],yy=Math.random()*pen,p={s:1,x:0,y:0,ts:0};
  if(type==='solid'){p.x=Math.random()*W;p.y=-2-Math.random()*(GEL-4)}
  else{p.s=0;p.ts=Math.random()*dur;
   if(type==='coated'){p.x=nx+(Math.random()<.5?-1:1)*hw(yy);p.y=yy}
   else if(type==='dissolving'){p.x=nx+(Math.random()-.5)*1.6*hw(yy);p.y=yy}
   else{p.x=nx;p.y=pen*.97}}
  parts.push(p)}
 t=0;hist=[];firstBlood=null;lastRec=-1;
 document.querySelectorAll('#types button').forEach(b=>b.classList.toggle('on',b.dataset.t===type));
 $('desc').textContent=TYPES[type][1];$('s_rate').disabled=type==='solid';
 const reached=pen>=CAP0;
 $('note').textContent=(reached?'Needles reach the capillaries, so drug can enter the blood straight from the needle tract. ':'Needles stop above the capillaries, so the drug has to diffuse the rest of the way. ')+(P.sharp<.3?'Blunt tips mean the skin dents and the needles only go in part of their length. ':'')+(mw()>500&&type==='solid'?'This drug is too big to cross the skin barrier except through the holes. ':'')+(P.lip>3.5?'A very oil-loving drug tends to stick in skin fats and moves slowly through watery tissue. ':'')}
function stepP(p){
 const nx=near(p.x);const gelHole=p.y<0&&Math.abs(p.x-nx)<hw(0)+5;let m;
 if(p.y<0){m=1;if(!gelHole){const d=nx-p.x;if(Math.abs(d)<220)p.x+=d*.02}}
 else{const lm=layer(p.y);const open=Math.max(0,1-t/60);const ch=p.y<pen&&Math.abs(p.x-nx)<hw(p.y)+4;m=ch?lm+(aq-lm)*open:lm}
 const sg=11*mwF*Math.sqrt(m);let x=p.x+gauss()*sg,y=p.y+gauss()*sg;
 if(p.y<0&&!gelHole&&y>-.5)y=-.5-Math.random()*3;
 if(y<-GEL)y=-2*GEL-y;if(y>DMAX)y=2*DMAX-y;if(x<0)x=-x;if(x>W)x=2*W-x;
 p.x=x;p.y=y;
 if(y>CAP0&&y<CAP1&&Math.random()<.25){p.s=2;p.y=(CAP0+CAP1)/2}}
function sim(){for(let k=0;k<P.speed;k++){t+=.02;
 for(const p of parts){if(p.s===0){if(t>=p.ts)p.s=1}else if(p.s===1)stepP(p);else if(p.x<W+20)p.x+=5}
 if(t-lastRec>=.5){lastRec=t;const c=cnt();if(c.a>0&&firstBlood===null)firstBlood=t;hist.push({t,a:c.a,s:c.s,p:c.p})}}}
function cnt(){let a=0,s=0,p=0;for(const q of parts){if(q.s===2)a++;else if(q.s===0||q.y<0)p++;else s++}return{a:a/N*100,s:s/N*100,p:p/N*100}}
// drawing
const col=()=>`hsl(${200-(P.lip+3)/8*170} 90% 62%)`;
function poly(c,x,y0,y1,w0,w1){c.beginPath();c.moveTo(x-w0,y0);c.lineTo(x+w0,y0);c.lineTo(x+w1,y1);c.lineTo(x-w1,y1);c.closePath()}
function drawScene(){
 const c=sx;c.clearRect(0,0,CW,CH);
 const y=d=>SURF+d*S;
 let g=c.createLinearGradient(0,y(100),0,y(DMAX));g.addColorStop(0,'#b0646a');g.addColorStop(1,'#6a3b52');
 c.fillStyle=g;c.fillRect(0,y(100),CW,CH-y(100));
 c.fillStyle='#d9998a';c.fillRect(0,y(P.sc),CW,(100-P.sc)*S);
 c.fillStyle='#ecd2b4';c.fillRect(0,y(0),CW,Math.max(3,P.sc*S));
 c.fillStyle='rgba(214,52,71,.6)';c.fillRect(0,y(CAP0),CW,(CAP1-CAP0)*S);
 c.font='12px sans-serif';c.fillStyle='rgba(255,255,255,.85)';
 c.fillText('Stratum corneum (barrier)',8,y(0)+Math.max(3,P.sc*S)+11);c.fillText('Epidermis',8,y(100)-4);c.fillText('Dermis',8,y(100)+14);
 c.fillText('Capillaries: drug that gets here enters the blood',8,y(CAP0)+13);
 const open=Math.max(0,1-t/60);
 if(type==='solid'){c.fillStyle='rgba(79,209,197,.28)';c.fillRect(0,y(-GEL),CW,GEL*S)}
 const bY=Math.min(SURF-(P.len-pen)*S,SURF-14)-6;
 const rel=parts.filter(p=>p.s!==0).length/N;
 // holes
 for(const nx of needles){c.fillStyle=`rgba(8,16,26,${.55*open})`;poly(c,nx*S,SURF,y(pen),24*S,hw(pen-.1)*S+1);c.fill()}
 // needles
 const showN=!(type==='solid'&&t>2);
 if(showN)for(const nx of needles){let rem=type==='dissolving'?1-rel:1;
  const bt=bY+6,tipY=bt+(y(pen)-bt)*(.15+.85*rem),wb=24*S*(.3+.7*rem),wt=tipW()*S*(.3+.7*rem)+.3;
  c.fillStyle=type==='dissolving'?'rgba(190,170,255,.85)':'#c9d3e6';poly(c,nx*S,bt,tipY,wb,wt);c.fill();
  if(type==='coated'){c.strokeStyle=`rgba(255,200,60,${1-rel})`;c.lineWidth=2.5;c.stroke()}
  if(type==='hollow'){c.strokeStyle='#0d1a29';c.lineWidth=1.5;c.beginPath();c.moveTo(nx*S,bt);c.lineTo(nx*S,tipY-2);c.stroke()}}
 c.fillStyle='#dbe3ee';c.fillRect(0,bY-8,CW,14);
 if(type==='hollow'){c.fillStyle='hsl(170 70% 50%)';c.fillRect(0,bY-8,CW*(1-rel),14)}
 // particles
 const r=1.8+Math.min(3,Math.log10(mw()/100)*1.1);
 for(const p of parts){if(p.s===0||p.x>W)continue;c.fillStyle=p.s===2?'#fff':col();c.beginPath();c.arc(p.x*S,y(p.y),p.s===2?r*.8:r,0,7);c.fill()}
 c.fillStyle='#fff';c.font='600 13px sans-serif';c.textAlign='right';c.fillText(t.toFixed(0)+' min'+(t>=TMAX?' (done)':''),CW-8,16);c.textAlign='left'}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function drawLine(){
 const c=c1,w=480,h=230,L=36,B=24,T=8,R=8,ink=css('--muted'),ln=css('--line');c.clearRect(0,0,w,h);
 c.font='11px sans-serif';c.fillStyle=ink;c.strokeStyle=ln;c.lineWidth=1;
 for(let i=0;i<=4;i++){const yy=T+(h-T-B)*i/4;c.beginPath();c.moveTo(L,yy);c.lineTo(w-R,yy);c.stroke();c.fillText(100-i*25,6,yy+4)}
 for(let i=0;i<=4;i++)c.fillText(i*15,L+(w-L-R)*i/4-6,h-8);
 c.fillText('minutes',w-R-44,h-8);
 const X=t=>L+(w-L-R)*t/TMAX,Y=v=>T+(h-T-B)*(1-v/100);
 [['a','#ff6b6b','In blood'],['s','#35c0b0','In skin'],['p','#8d9ff0','Still in patch']].forEach(([k,cl,nm],j)=>{
  c.strokeStyle=cl;c.lineWidth=2.5;c.beginPath();hist.forEach((q,i)=>i?c.lineTo(X(q.t),Y(q[k])):c.moveTo(X(q.t),Y(q[k])));c.stroke();
  c.fillStyle=cl;c.fillRect(L+8+j*96,T+4,10,10);c.fillStyle=ink;c.fillText(nm,L+22+j*96,T+13)})}
function drawBars(){
 const c=c2,w=300,h=230,bins=20,cn=Array(bins).fill(0);
 for(const p of parts)if(p.s===1&&p.y>=0)cn[Math.min(bins-1,p.y/40|0)]++;
 const mx=Math.max(6,...cn);c.clearRect(0,0,w,h);c.font='11px sans-serif';
 const bh=(h-6)/bins;
 for(let i=0;i<bins;i++){const d=i*40;c.fillStyle=d<P.sc?'#e0b98f':d<100?'#d9998a':'#b0646a';
  c.fillRect(46,3+i*bh,(w-56)*cn[i]/mx,bh-2);
  if(i%4===0){c.fillStyle=css('--muted');c.fillText(d+' µm',4,3+i*bh+10)}}
 const cy=3+(CAP0/40)*bh;c.strokeStyle='#ff6b6b';c.setLineDash([4,3]);c.beginPath();c.moveTo(46,cy);c.lineTo(w-6,cy);c.stroke();c.setLineDash([]);
 c.fillStyle='#ff6b6b';c.fillText('capillaries',w-62,cy-3)}
function stats(){const c=cnt(),d=pen<P.sc?'barrier':pen<100?'epidermis':'dermis';
 $('stats').innerHTML=[[c.a.toFixed(0)+'%','in blood'],[c.s.toFixed(0)+'%','in skin'],[c.p.toFixed(0)+'%','still in patch'],[firstBlood===null?'–':firstBlood.toFixed(1)+' min','first drug in blood'],[Math.round(pen)+' µm','needle depth ('+d+')']].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}
function tick(){if(running&&t<TMAX)sim();drawScene();drawLine();drawBars();if(frame++%8===0)stats();requestAnimationFrame(tick)}
reset();tick();
</script></body></html>
